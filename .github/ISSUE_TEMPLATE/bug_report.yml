name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: data-profiler-mcp version
      placeholder: "0.2.0 (pip show data-profiler-mcp)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python / MCP SDK / OS
      placeholder: "Python 3.12, mcp 2.0.0, Windows 11"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        Which tool did you call, with what arguments? If the problem depends on
        the data, attach a minimal sample file (or a snippet that generates
        one). Do not attach files containing real personal or business data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      description: Include the full error message or traceback if there is one.
    validations:
      required: true
